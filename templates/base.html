{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="auto">
<meta charset="utf-8">
<meta name="author" content="Edwyn Flores">
<title>Black Scholes Model {% block title %}{% endblock %}</title>

<link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
<link href="{% static 'css/main.css' %}" rel="stylesheet">

<link href="{% static 'css/dashboard.css'%}" rel="stylesheet">
<body>
  <header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">
    <div id="loader" class="loader"></div>
  </header>
  <header class="navbar sticky-top bg-dark flex-md-nowrap p-0 shadow" data-bs-theme="dark">
    <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3 fs-6 text-white">Black Scholes Model</a>
    <a href="https://github.com/f-edwyn/blackscholeswebsite" target="_blank" class="btn btn-outline-primary">View on GitHub</a>
  </header>

  <div class="container-fluid">
    <div class="row">
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 order-md-1">
        {% block content %}{% endblock %}
      </main>
      {% include 'partials/_sidebar.html' %}
    </div>
  </div>
  <script src="{% static 'js/main.js'%}"></script>
</body>
</html>
